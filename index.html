
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PatrolGuard GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        #root {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            background-color: #020617;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Safe Areas para dispositivos modernos */
        .safe-top { padding-top: env(safe-area-inset-top, 0px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
        
        #root::-webkit-scrollbar { display: none; }
        #root { -ms-overflow-style: none; scrollbar-width: none; }

        /* Garantir que o app preencha a largura total */
        .full-width-container {
            width: 100vw;
            max-width: 100%;
        }
    </style>
