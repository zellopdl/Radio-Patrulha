
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PatrolGuard GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background-color: #020617;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        #root {
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Safe Areas para dispositivos com Notch */
        .safe-top { padding-top: env(safe-area-inset-top, 20px); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 20px); }
        
        /* Esconder scrollbars visuais */
        #root::-webkit-scrollbar {
            display: none;
        }
        #root {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Estilo para desktop: centralizar e simular tela de celular */
        @media (min-width: 600px) {
            body {
                display: flex;
                justify-content: center;
                background-color: #000;
            }
            #root {
                max-width: 500px;
                border-left: 1px solid #1e293b;
                border-right: 1px solid #1e293b;
                box-shadow: 0 0 100px rgba(0,0,0,0.8);
            }
        }
    </style>
<script type="importmap">
{

  }
}
</script>
</head>
<body class="h-full">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
