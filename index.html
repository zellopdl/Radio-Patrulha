
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>PatrolGuard GPS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --app-height: 100%;
        }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #020617;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            overflow-x: hidden;
        }
        #root {
            width: 100%;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            max-width: 500px; /* Um pouco mais largo para tablets/desktop, mas flexível */
            background-color: #020617;
            position: relative;
            box-shadow: 0 0 100px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
        }
        /* No mobile real, garantimos que ocupe tudo sem bordas */
        @media (max-width: 500px) {
            #root {
                max-width: 100%;
                box-shadow: none;
            }
        }
        
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* Ajuste para áreas de recorte (notches) em iPhones modernos */
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
<script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.575.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0"
  }
}
</script>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
